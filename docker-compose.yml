services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: easy_go_docs
    # For `make run`, which runs the server on the host. Bound to localhost only, on a non-default port
    # to avoid clashing with a local PostgreSQL.
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d easy_go_docs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Revocations must survive a restart and must not be evicted, see "Token revocation" in README.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    # For `make run`, which runs the server on the host. Bound to localhost only, on a non-default port
    # to avoid clashing with a local Redis.
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    image: ghcr.io/kukymbr/goose-docker:3.24.3
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=host=db port=5432 user=app password=pass dbname=easy_go_docs
    volumes:
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_healthy

  create-admin:
    build: .
    depends_on:
      migrations:
        condition: service_completed_successfully
    entrypoint: ["/app/seedadmin"]
    environment:
      DATABASE_DSN: "postgres://app:pass@db:5432/easy_go_docs?sslmode=disable"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "changeme"
    restart: "no"

  app:
    build: .
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_DSN: "postgres://app:pass@db:5432/easy_go_docs?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "l5VwxuCXfmJ3G8vn2rzEo+UHar86kIb4CLW7mUqMlvM="
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
