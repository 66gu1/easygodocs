version: "2"
run:
  build-tags:
    - testutil
  tests: true
linters:
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - dupl
    - errorlint
    - forbidigo
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unparam
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      check-type-assertions: true
      check-blank: true
    forbidigo:
      forbid:
        - pattern: fmt\.Print.* # use zerolog instead
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104 # unchecked errors are covered by errcheck
    lll:
      line-length: 120
      tab-width: 1
    nolintlint:
      require-explanation: true
      require-specific: true
    wrapcheck:
      # domain errors are created with apperr constructors and returned as is
      ignore-package-globs:
        - github.com/66gu1/easygodocs/internal/infrastructure/apperr
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true
        - name: var-naming
        - name: receiver-naming
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - containedctx
          - dupl
          - funlen
          - goconst
          - gocyclo
          - lll
        path: _test\.go
      - linters:
          - gosec
        text: G117 # test fixtures marshal request bodies with passwords
        path: _test\.go
      - linters:
          - dupl # similar SQL blocks
          - lll # long raw SQL queries
        path: repo/gorm
    paths:
      - .*_mock\.go
      - .*\.pb\.go
      - vendor
      - (^|[\\/])mocks([\\/]|$)
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
  exclusions:
    generated: lax
    paths:
      - .*_mock\.go
      - .*\.pb\.go
      - vendor
      - (^|[\\/])mocks([\\/]|$)
      - third_party$
      - builtin$
      - examples$
